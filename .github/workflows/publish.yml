name: Publish a package to npmjs

on:
  release:
    types: [created]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get latest release tag
        id: get-latest-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$(gh release view --json tagName --jq .tagName)"
          echo "Identified latest release tag: '$TAG'"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish
        uses: govuk-one-login/github-actions/node/run-script@b5f4f92a0692bf297b08c43745e545e45631f0ee
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          script: npm publish --provenance --access public --tag ${{ steps.get-latest-tag.outputs.tag == github.ref_name && github.ref_type == 'tag' && 'latest' || 'legacy' }}
